<!DOCTYPE html>
<html>

<head>
    <title>Page Setup</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <input type="radio" id="light" name="theme" checked>
    <input type="radio" id="dark" name="theme">
    <input type="radio" id="contrast" name="theme">

    <div class="theme-selector">

        <strong>Theme:</strong>

        <label for="light">
            Light
        </label>

        <label for="dark">
            Dark
        </label>

        <label for="contrast">
            High Contrast
        </label>

    </div>

    <div class="page-setup">

        <div class="window-header">

            <span>Page Setup</span>

            <button class="close-button">&times;</button>

        </div>

        <div class="window-content">

            <div class="left-section">

                <div class="section">

                    <h3>Orientation</h3>

                    <label>
                        <input type="radio" name="orientation" checked>
                        Portrait
                    </label>

                    <label>
                        <input type="radio" name="orientation">
                        Landscape
                    </label>

                </div>

                <div class="section">

                    <h3>Paper Size</h3>

                    <select>

                        <option>
                            Letter (21.6 cm x 27.9 cm)
                        </option>

                        <option>
                            A4 (21.0 cm x 29.7 cm)
                        </option>

                        <option>
                            A5 (14.8 cm x 21.0 cm)
                        </option>

                    </select>

                </div>

                <div class="section">

                    <h3>Page Colour</h3>

                    <input type="color">

                </div>

            </div>

            <div class="right-section">

                <h3>
                    Margins
                    <span>(centimetres)</span>
                </h3>

                <label>
                    Top
                    <input type="number" value="2.54">
                </label>

                <label>
                    Bottom
                    <input type="number" value="2.54">
                </label>

                <label>
                    Left
                    <input type="number" value="2.54">
                </label>

                <label>
                    Right
                    <input type="number" value="2.54">
                </label>

            </div>

        </div>

        <div class="window-footer">

            <div>

                <button class="ok-button">
                    OK
                </button>

                <button class="cancel-button">
                    Cancel
                </button>

            </div>

            <button class="default-button">
                Set as default
            </button>

        </div>

    </div>

</body>

</html>
